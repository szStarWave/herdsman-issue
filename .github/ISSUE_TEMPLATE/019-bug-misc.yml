name: Bug (其他/Misc.)
description: 未被其他模板覆盖的缺陷。Bugs not covered by the other templates.
title: "Misc. bug: "
labels: ["bug-unconfirmed"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！本模板用于 **其他未分类** 的缺陷。
        Thanks for reporting! Use this for bugs that do not fit other templates.

        请自行填写，勿直接粘贴大模型生成内容。
        Please fill this out yourself; do not paste LLM-generated text.

  - type: textarea
    id: version
    attributes:
      label: 版本 / Version
      description: Herdsman 版本或构建号。Herdsman version or build number.
      placeholder: e.g. 2026.06.02 / build xyz
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统 / Operating systems
      description: 已知受影响的系统。Which OS are affected?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Other (请在描述中说明 / please specify)
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块 / Affected modules
      description: 已知受影响的模块。Which modules are affected?
      multiple: true
      options:
        - Desktop App
        - Model Manager
        - Runtime (llama.cpp / NPU / Foundry / sd-cpp / etc.)
        - Gateway API
        - Apps
        - Persona / Memory
        - Documentation / GitHub
        - Other (请在描述中说明 / please specify)
    validations:
      required: false

  - type: textarea
    id: info
    attributes:
      label: 问题描述与复现步骤 / Problem & steps to reproduce
      description: |
        简述现象，并给出可复现步骤（如适用）。
        Summarize the problem and steps to reproduce (if applicable).
    validations:
      required: true

  - type: textarea
    id: first_bad
    attributes:
      label: 首次出现版本 / First bad version
      description: 若先前版本正常，请注明从哪一版开始出现。If an older version worked, when did it start?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant logs
      description: |
        如有相关日志请粘贴。常见路径：`~/.herdsman/log`、`~/.cache/herdsman/logs`。
        Paste logs if available. Common paths: `~/.herdsman/log`, `~/.cache/herdsman/logs`.
      value: |
        <details>
        <summary>Logs</summary>

        ```console

        ```
        </details>
    validations:
      required: false
